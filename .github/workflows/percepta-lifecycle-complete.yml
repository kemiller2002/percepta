name: Complete governed Percepta lifecycle work

on:
  push:
    branches:
      - feature/percepta-lifecycle-distribution
    paths:
      - ".github/workflows/percepta-lifecycle-complete.yml"

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install current Praxis binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/praxis/main/scripts/install-native.sh | sh
          echo "$HOME/.echelon/bin" >> "$GITHUB_PATH"

      - name: Verify active governed context
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.echelon/bin:$PATH"
          ros work context WI-PERCEPTA-LIFECYCLE-001
          ros work validate

      - name: Run release-grade lifecycle verification
        shell: bash
        run: |
          set -euo pipefail
          node distribution/percepta-repository-lifecycle/launcher.test.mjs
          (
            cd distribution/percepta-repository-lifecycle
            npm pack --dry-run
          )
          dotnet build src/Percepta.RepositoryLifecycle/Percepta.RepositoryLifecycle.fsproj --configuration Release
          dotnet run --project tests/Percepta.RepositoryLifecycle.Tests/Percepta.RepositoryLifecycle.Tests.fsproj --configuration Release

          out="$RUNNER_TEMP/percepta-repo-native"
          target="$RUNNER_TEMP/percepta-repo-target"
          dotnet publish src/Percepta.RepositoryLifecycle/Percepta.RepositoryLifecycle.fsproj             --configuration Release             --runtime linux-x64             --self-contained true             -p:PublishSingleFile=true             -p:DebugType=None             -p:DebugSymbols=false             --output "$out"

          mkdir -p "$target"
          printf '# Existing instructions\n\nPreserve me.\n' > "$target/AGENTS.md"
          "$out/percepta-repo" init --target "$target"
          "$out/percepta-repo" verify --strict --target "$target"
          "$out/percepta-repo" doctor --json --target "$target" > "$RUNNER_TEMP/doctor.json"
          grep -F '"healthy": true' "$RUNNER_TEMP/doctor.json"

          first_manifest="$(sha256sum "$target/.echelon/percepta.json")"
          first_agents="$(sha256sum "$target/AGENTS.md")"
          "$out/percepta-repo" init --target "$target"
          test "$first_manifest" = "$(sha256sum "$target/.echelon/percepta.json")"
          test "$first_agents" = "$(sha256sum "$target/AGENTS.md")"

      - name: Remove temporary governance bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f             .github/workflows/percepta-lifecycle-work.yml             .github/workflows/percepta-lifecycle-begin.yml             .github/workflows/percepta-lifecycle-begin2.yml             .github/workflows/percepta-lifecycle-begin3.yml             .github/workflows/percepta-lifecycle-begin4.yml             .github/workflows/percepta-lifecycle-complete.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows

          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary Percepta lifecycle bootstrap workflows"
          fi

      - name: Complete Praxis work with evidence
        shell: bash
        env:
          ROS_BASE_REF: origin/main
        run: |
          set -euo pipefail
          export PATH="$HOME/.echelon/bin:$PATH"

          ros work complete             --id WI-PERCEPTA-LIFECYCLE-001             --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"             --evidence implementation=src/Percepta.RepositoryLifecycle/Lifecycle.fs             --evidence tests=tests/Percepta.RepositoryLifecycle.Tests/Program.fs             --actor-kind agent             --agent openai/chatgpt             --provider openai             --runtime chatgpt

          ros work context WI-PERCEPTA-LIFECYCLE-001
          ros work validate

      - name: Record full baseline validation without absorbing unrelated debt
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.echelon/bin:$PATH"
          ros validate
          code=$?
          set -e
          echo "Repository-wide baseline validation exit code: $code"
          echo "Known EX-PERCEPTA-2026-0004 validation debt remains outside WI-PERCEPTA-LIFECYCLE-001."

      - name: Commit final Praxis evidence
        shell: bash
        run: |
          set -euo pipefail
          git add .ros
          if ! git diff --cached --quiet; then
            git commit -m "Complete Percepta repository lifecycle work"
          fi
          git pull --rebase origin feature/percepta-lifecycle-distribution
          git push origin HEAD:feature/percepta-lifecycle-distribution
