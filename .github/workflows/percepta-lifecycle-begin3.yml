name: Begin Percepta lifecycle work v3

on:
  push:
    branches:
      - feature/percepta-lifecycle-distribution
    paths:
      - ".github/workflows/percepta-lifecycle-begin3.yml"

permissions:
  contents: write

jobs:
  begin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install current Praxis binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/praxis/main/scripts/install-native.sh | sh
          echo "$HOME/.echelon/bin" >> "$GITHUB_PATH"

      - name: Establish current Praxis work context
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.echelon/bin:$PATH"
          work_id="WI-PERCEPTA-LIFECYCLE-001"
          occurred_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

          if ! ros work show "$work_id" >/dev/null 2>&1; then
            ros add "Add reusable Percepta repository lifecycle distribution"               --id "$work_id"               --priority high               --tag percepta               --tag lifecycle               --tag distribution               --source manual               --source-reference "docs/PERCEPTA-LIFECYCLE-DISTRIBUTION.md"
          fi

          ros work backlog-transition             --action ready             --id "$work_id"             --occurred-at "$occurred_at"

          ros work begin             --id "$work_id"             --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"             --type feature             --actor-kind agent             --provider openai             --runtime chatgpt

          ros work context "$work_id"

      - name: Reconcile remote bootstrap commits
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.echelon/bin:$PATH"
          work_id="WI-PERCEPTA-LIFECYCLE-001"
          base="$(git merge-base origin/main HEAD)"

          ros work reconcile             --id "$work_id"             --reason "Remote bootstrap commits were required to establish the governed Praxis context before product mutation."             --range "$base..HEAD"             --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

      - name: Validate governed work state
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.echelon/bin:$PATH"
          ros validate

      - name: Commit Praxis state
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain .ros | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ros
            git commit -m "Begin governed Percepta lifecycle work"
            git pull --rebase origin feature/percepta-lifecycle-distribution
            git push origin HEAD:feature/percepta-lifecycle-distribution
          else
            echo "No Praxis state changes to commit."
          fi
