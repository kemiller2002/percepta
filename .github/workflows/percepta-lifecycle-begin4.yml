name: Persist governed Percepta lifecycle work

on:
  push:
    branches:
      - feature/percepta-lifecycle-distribution
    paths:
      - ".github/workflows/percepta-lifecycle-begin4.yml"

permissions:
  contents: write

jobs:
  begin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install current Praxis binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/praxis/main/scripts/install-native.sh | sh
          echo "$HOME/.echelon/bin" >> "$GITHUB_PATH"

      - name: Establish current Praxis work context
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.echelon/bin:$PATH"
          work_id="WI-PERCEPTA-LIFECYCLE-001"

          if ! ros work show "$work_id" >/dev/null 2>&1; then
            ros add "Add reusable Percepta repository lifecycle distribution"               --id "$work_id"               --priority high               --tag percepta               --tag lifecycle               --tag distribution               --source manual               --source-reference "docs/PERCEPTA-LIFECYCLE-DISTRIBUTION.md"
          fi

          ros work backlog-transition             --action ready             --id "$work_id"             --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

          ros work begin             --id "$work_id"             --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"             --type feature             --actor-kind agent             --provider openai             --runtime chatgpt

      - name: Reconcile remote bootstrap commits
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.echelon/bin:$PATH"
          base="$(git merge-base origin/main HEAD)"

          ros work reconcile             --id WI-PERCEPTA-LIFECYCLE-001             --reason "Remote bootstrap commits were required to establish the governed Praxis context before product mutation."             --range "$base..HEAD"             --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

      - name: Validate work protocol state
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.echelon/bin:$PATH"
          ros work validate
          ros work context WI-PERCEPTA-LIFECYCLE-001

      - name: Record repository baseline validation
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.echelon/bin:$PATH"
          ros validate
          code=$?
          set -e
          echo "Baseline repository validation exit code: $code"
          # Known EX-PERCEPTA-2026-0004 baseline defects are outside this work item's scope.
          # Work-protocol validation above remains the hard gate.

      - name: Commit Praxis state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ros
          git commit -m "Begin governed Percepta lifecycle work"
          git pull --rebase origin feature/percepta-lifecycle-distribution
          git push origin HEAD:feature/percepta-lifecycle-distribution
